<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 - 웹 접근성 검증 AI Agent</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <header class="hero hero--compact">
    <div class="hero__inner">
      <span class="hero__mark">A11y Agent · 관리자</span>
      <h1>서비스 설정</h1>
      <p class="hero__sub">이 페이지는 관리자 전용입니다. 방문자에게 링크를 공유하지 마세요.</p>
    </div>
  </header>

  <main class="container">
    <section id="login-panel" class="panel">
      <label for="password">관리자 비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호 입력" />
      <button id="login-btn" type="button" class="btn btn--primary">로그인</button>
      <p id="login-msg" class="hint"></p>
    </section>

    <section id="config-panel" class="panel" hidden>
      <label>운영 모드</label>
      <div class="mode-options">
        <label class="mode-option">
          <input type="radio" name="mode" value="admin" />
          <div>
            <strong>관리자 키 사용</strong>
            <p class="hint" style="margin:2px 0 0;">방문자는 URL만 입력합니다. 검사 비용은 관리자(운영자)가 부담합니다.</p>
          </div>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="visitor" />
          <div>
            <strong>방문자 직접 입력</strong>
            <p class="hint" style="margin:2px 0 0;">방문자가 자기 공급자/모델/API 키를 반드시 입력해야 검사할 수 있습니다. 관리자에게 비용이 청구되지 않습니다.</p>
          </div>
        </label>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />

      <p class="hint" id="key-panel-desc" style="margin-top:0;"></p>

      <label for="provider">공급자</label>
      <select id="provider">
        <option value="gemini">Gemini (Google)</option>
        <option value="claude">Claude (Anthropic)</option>
        <option value="openai">OpenAI (GPT)</option>
      </select>

      <label for="model">모델</label>
      <select id="model"></select>

      <label for="api-key" id="api-key-label">API 키</label>
      <input id="api-key" type="password" placeholder="새 키를 입력할 때만 값을 채워주세요" autocomplete="off" />
      <p id="key-status" class="hint"></p>

      <button id="save-btn" type="button" class="btn btn--primary">저장</button>
      <p id="save-msg" class="hint"></p>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />

      <label>설명 캐시</label>
      <p class="hint">저장된 설명 캐시: <strong id="cache-count">-</strong>건</p>
      <button id="clear-cache-btn" type="button" class="btn btn--secondary">캐시 전체 초기화</button>
      <p id="cache-msg" class="hint"></p>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
