<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 - 웹 접근성 검증 AI Agent</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <header class="hero hero--compact">
    <div class="hero__inner">
      <span class="hero__mark">A11y Agent · 관리자</span>
      <h1>서비스 설정</h1>
      <p class="hero__sub">이 페이지는 관리자 전용입니다. 방문자에게 링크를 공유하지 마세요.</p>
    </div>
  </header>

  <main class="container">
    <section id="login-panel" class="panel">
      <label for="password">관리자 비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호 입력" />
      <button id="login-btn" type="button" class="btn btn--primary">로그인</button>
      <p id="login-msg" class="hint"></p>
    </section>

    <section id="dashboard-panel" class="panel" hidden>
      <div class="dash-header">
        <strong>📊 접근성 모니터링 대시보드</strong>
        <button id="dash-refresh-btn" type="button" class="btn btn--ghost" style="width:auto;padding:6px 12px;font-size:12px;">새로고침</button>
      </div>
      <p id="dash-msg" class="hint"></p>
      <div id="dash-summary" class="dash-summary"></div>
      <div id="dash-table"></div>
      <div id="dash-top"></div>
    </section>

    <section id="config-panel" class="panel" hidden>
      <label>운영 모드</label>
      <div class="mode-options">
        <label class="mode-option">
          <input type="radio" name="mode" value="admin" />
          <div>
            <strong>관리자 키 사용</strong>
            <p class="hint" style="margin:2px 0 0;">방문자는 URL만 입력합니다. 검사 비용은 관리자(운영자)가 부담합니다.</p>
          </div>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="visitor" />
          <div>
            <strong>방문자 직접 입력</strong>
            <p class="hint" style="margin:2px 0 0;">방문자가 자기 공급자/모델/API 키를 반드시 입력해야 검사할 수 있습니다. 관리자에게 비용이 청구되지 않습니다.</p>
          </div>
        </label>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />

      <p class="hint" id="key-panel-desc" style="margin-top:0;"></p>

      <label for="provider">공급자</label>
      <select id="provider">
        <option value="gemini">Gemini (Google)</option>
        <option value="claude">Claude (Anthropic)</option>
        <option value="openai">OpenAI (GPT)</option>
      </select>

      <label for="model">모델</label>
      <select id="model"></select>

      <label for="api-key" id="api-key-label">API 키</label>
      <input id="api-key" type="password" placeholder="새 키를 입력할 때만 값을 채워주세요" autocomplete="off" />
      <p id="key-status" class="hint"></p>

      <button id="save-btn" type="button" class="btn btn--primary">저장</button>
      <p id="save-msg" class="hint"></p>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />

      <label>설명 캐시</label>
      <p class="hint">저장된 설명 캐시: <strong id="cache-count">-</strong>건</p>
      <button id="clear-cache-btn" type="button" class="btn btn--secondary">캐시 전체 초기화</button>
      <p id="cache-msg" class="hint"></p>

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0;" />

      <label>정기 모니터링</label>
      <p class="hint" style="margin-top:0;">
        등록한 URL을 선택한 주기마다 자동으로 검사하고, 결과를 저장소에 쌓아 위의 대시보드에 보여줍니다
        (최대 <span id="monitor-max">5</span>개 등록 가능). 새로 등록한 URL은 다음 확인 시점(최대 10분 이내)에 처음 검사됩니다.
      </p>
      <p class="hint" id="storage-note" style="margin-top:0;"></p>

      <label class="mode-option" style="margin-bottom:14px;">
        <input type="checkbox" id="monitor-enabled-toggle" style="width:auto;margin-top:3px;" />
        <div>
          <strong>정기 모니터링 사용</strong>
          <p class="hint" style="margin:2px 0 0;">꺼두면 등록된 URL이 있어도 자동 검사가 실행되지 않습니다 ("지금 검사" 수동 실행은 계속 가능).</p>
        </div>
      </label>

      <div class="monitor-add-row">
        <label for="monitor-cycle" style="margin:0;flex-shrink:0;align-self:center;font-weight:600;font-size:13px;">검사 주기</label>
        <select id="monitor-cycle" style="max-width:180px;margin:0;">
          <option value="daily">하루</option>
          <option value="weekly">일주일</option>
          <option value="biweekly">2주</option>
          <option value="monthly">한 달(30일)</option>
        </select>
        <button id="monitor-settings-save-btn" type="button" class="btn btn--secondary" style="width:auto;">저장</button>
      </div>
      <p id="monitor-settings-msg" class="hint"></p>

      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;" />

      <div class="monitor-add-row">
        <input id="monitor-url" type="url" placeholder="https://example.com" />
        <button id="monitor-add-btn" type="button" class="btn btn--primary" style="width:auto;">등록</button>
      </div>
      <p id="monitor-msg" class="hint"></p>

      <div id="monitor-list"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
