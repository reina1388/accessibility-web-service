<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 접근성 검증 AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <span class="hero__mark">A11y Agent</span>
      <h1>웹 접근성 검증 AI Agent</h1>
      <p class="hero__sub">URL을 입력하면 AI 에이전트가 페이지를 직접 열어 접근성을 검사하고, 문제점과 수정 방법을 안내합니다.</p>
      <a class="hero__download" href="/downloads/accessibility-agent-extension.zip" download>
        🧩 크롬 확장 프로그램으로도 사용하기 (zip 다운로드)
      </a>
    </div>
  </header>

  <main class="container">
    <form id="check-form" class="panel">
      <label for="url">검사할 웹페이지 URL</label>
      <input id="url" type="url" placeholder="https://example.com" required />

      <section id="own-key-section" class="own-key-section" hidden>
        <p class="hint" id="own-key-desc" style="margin-top:0;"></p>

        <label for="own-provider">AI 공급자</label>
        <select id="own-provider">
          <option value="gemini">Gemini (Google)</option>
          <option value="claude">Claude (Anthropic)</option>
          <option value="openai">OpenAI (GPT)</option>
        </select>

        <label for="own-model">모델</label>
        <select id="own-model"></select>

        <label for="own-api-key">API 키</label>
        <input id="own-api-key" type="password" placeholder="API 키 입력" autocomplete="off" />
        <p class="hint">이 브라우저의 localStorage에만 저장되고, 검사 요청에만 함께 전달됩니다.</p>
      </section>

      <button type="submit" id="submit-btn" class="btn btn--primary">검사하기</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <details id="agent-log" class="agent-log" hidden>
      <summary>에이전트 활동 로그 <span id="agent-log-count"></span></summary>
      <ol id="agent-log-list"></ol>
    </details>

    <section id="continue-section" class="continue-section" hidden>
      <p id="continue-text"></p>
      <div class="continue-buttons">
        <button id="continue-btn" type="button" class="btn btn--secondary">▶ 계속 검사하기</button>
        <button id="finish-btn" type="button" class="btn btn--ghost">✓ 여기까지 결과로 확정하기</button>
      </div>
    </section>

    <section id="summary" class="summary" hidden></section>
    <section id="results" class="results"></section>
  </main>

  <footer class="footer">
    <span id="cache-info"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
